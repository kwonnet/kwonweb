# Build in Cloud Build (linux/amd64), then deploy the resulting immutable tag.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/kwonweb:$BUILD_ID
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - --build-arg
      - NEXT_PUBLIC_APP_LOGO=${_NEXT_PUBLIC_APP_LOGO}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_BUNNY_PULL_ZONE=${_NEXT_PUBLIC_BUNNY_PULL_ZONE}
      - --build-arg
      - NEXT_PUBLIC_BUNNY_PULL_ZONE_URL=${_NEXT_PUBLIC_BUNNY_PULL_ZONE_URL}
      - --build-arg
      - NEXT_PUBLIC_BUNNY_STORAGE_UPLOAD_FILE_UID=${_NEXT_PUBLIC_BUNNY_STORAGE_UPLOAD_FILE_UID}
      - --build-arg
      - NEXT_PUBLIC_BUNNY_STORAGE_URL=${_NEXT_PUBLIC_BUNNY_STORAGE_URL}
      - --build-arg
      - NEXT_PUBLIC_BUNNY_TUS_ENDPOINT=${_NEXT_PUBLIC_BUNNY_TUS_ENDPOINT}
      - --build-arg
      - NEXT_PUBLIC_BUNNY_VIDEO_LIBRARY_ID=${_NEXT_PUBLIC_BUNNY_VIDEO_LIBRARY_ID}
      - --build-arg
      - NEXT_PUBLIC_BUNNY_VIDEO_STREAM_URL=${_NEXT_PUBLIC_BUNNY_VIDEO_STREAM_URL}
      - --build-arg
      - NEXT_PUBLIC_FLUTTERWAVE_PUBK=${_NEXT_PUBLIC_FLUTTERWAVE_PUBK}
      - --build-arg
      - NEXT_PUBLIC_FLUTTERWAVE_REDIRECT_URL=${_NEXT_PUBLIC_FLUTTERWAVE_REDIRECT_URL}
      - --build-arg
      - NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY=${_NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY}
      - --build-arg
      - NEXT_PUBLIC_IMAGEKIT_UPLOAD_DIR=${_NEXT_PUBLIC_IMAGEKIT_UPLOAD_DIR}
      - --build-arg
      - NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT=${_NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT}
      - --build-arg
      - NEXT_PUBLIC_MONETAG_ADS_SRC=${_NEXT_PUBLIC_MONETAG_ADS_SRC}
      - --build-arg
      - NEXT_PUBLIC_MONETAG_SDK=${_NEXT_PUBLIC_MONETAG_SDK}
      - --build-arg
      - NEXT_PUBLIC_MONETAG_ZONE=${_NEXT_PUBLIC_MONETAG_ZONE}
      - --build-arg
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${_NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/kwonweb:$BUILD_ID
substitutions:
  _REGION: us-central1
  _REPOSITORY: kwonnet
  _NEXT_PUBLIC_API_URL: ""
  _NEXT_PUBLIC_APP_LOGO: ""
  _NEXT_PUBLIC_APP_URL: ""
  _NEXT_PUBLIC_BUNNY_PULL_ZONE: ""
  _NEXT_PUBLIC_BUNNY_PULL_ZONE_URL: ""
  _NEXT_PUBLIC_BUNNY_STORAGE_UPLOAD_FILE_UID: ""
  _NEXT_PUBLIC_BUNNY_STORAGE_URL: ""
  _NEXT_PUBLIC_BUNNY_TUS_ENDPOINT: ""
  _NEXT_PUBLIC_BUNNY_VIDEO_LIBRARY_ID: ""
  _NEXT_PUBLIC_BUNNY_VIDEO_STREAM_URL: ""
  _NEXT_PUBLIC_FLUTTERWAVE_PUBK: ""
  _NEXT_PUBLIC_FLUTTERWAVE_REDIRECT_URL: ""
  _NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY: ""
  _NEXT_PUBLIC_IMAGEKIT_UPLOAD_DIR: ""
  _NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: ""
  _NEXT_PUBLIC_MONETAG_ADS_SRC: ""
  _NEXT_PUBLIC_MONETAG_SDK: ""
  _NEXT_PUBLIC_MONETAG_ZONE: ""
  _NEXT_PUBLIC_VAPID_PUBLIC_KEY: ""
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
